<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- Deliberately no interactive-widget=resizes-content here: this WebView ignores it (measured -
         window.innerHeight does not change when the IME opens), and SafeAreaInsetsInjector shrinks the
         WebView by the IME inset instead. If a future WebView honors the keyword, both would fire and
         the layout viewport would shrink twice. The iOS equivalent is the keyboard script below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crafting Calculator</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app"></div>

    <!-- The startup cloak, and deliberately a sibling of #app rather than a Blazor component: it has to
         be on screen from the very first paint, which happens well before the Blazor app boots, and
         Blazor replaces everything inside #app once it does. MainLayout calls appCloak.dismiss when the
         layout has resolved. Styles live with the rest of the app's own in app.css. -->
    <div id="app-cloak" class="app-cloak">
        <span class="app-cloak-text display-title">Stoking the forge...</span>
    </div>

    <!-- Directly after the markup it fills, so the phrase is in place before the parser moves on. -->
    <script src="js/cloak.js"></script>

    <!-- Blazor's own error bar, shown by its script when an exception reaches the renderer past every
         boundary in the app. The script finds the reload and dismiss controls by their class names, so those
         stay as the template wrote them; the wording, and a real button where the template had a bare span,
         are the app's own. Its appearance lives with the rest in app.css.
         The alert role is what announces it: the script reveals the bar by changing its display, which moves
         no focus and is silent to a screen reader on its own. -->
    <div id="blazor-error-ui" data-nosnippet role="alert">
        Something went wrong. It's not you. It's me.
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss this message">🗙</button>
    </div>

    <!-- The app's own scripts load before Blazor's, so everything Blazor calls into is defined by the
         time it starts: history and scroll positioning, the on-screen keyboard policy, and the bar
         heights the stylesheet offsets by. -->
    <script src="js/navigation.js"></script>
    <script src="js/keyboard.js"></script>
    <script src="js/layout.js"></script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
