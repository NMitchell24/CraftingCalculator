<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <!-- Deliberately no interactive-widget=resizes-content here: this WebView ignores it (measured -
         window.innerHeight does not change when the IME opens), and SafeAreaInsetsInjector shrinks the
         WebView by the IME inset instead. If a future WebView honors the keyword, both would fire and
         the layout viewport would shrink twice. The iOS equivalent is the keyboard script below. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crafting Calculator</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div id="app"></div>

    <!-- The startup cloak, and deliberately a sibling of #app rather than a Blazor component: it has to
         be on screen from the very first paint, which happens well before the Blazor app boots, and
         Blazor replaces everything inside #app once it does. MainLayout calls appCloak.dismiss when the
         layout has resolved. Styles live with the rest of the app's own in app.css. -->
    <div id="app-cloak" class="app-cloak">
        <span class="app-cloak-text display-title">Stoking the forge...</span>
    </div>

    <script>
        // Inline and directly after the markup it fills, so the phrase is in place before the parser can
        // yield and let the browser paint; an external file would leave the cloak sitting empty until it
        // arrived. The span already carries the first phrase as a literal, so a paint that lands between
        // the two still shows words rather than a bare slate - this only swaps in the random pick, and is
        // why that one phrase appears in both places. Add, cut, or reword freely; the only thing each one
        // has to do is read as "still working on it".
        (function () {
            var phrases = [
                'Stoking the forge...',
                'Gathering your materials...',
                'Hammering out the details...',
                'Sharpening the axe...',
                'Counting every last nail...',
                'Smelting down the numbers...',
                'Foraging for spare parts...',
                'Waking up the blacksmith...'
            ];

            var cloak = document.getElementById('app-cloak');
            cloak.firstElementChild.textContent = phrases[Math.floor(Math.random() * phrases.length)];

            window.appCloak = {
                dismiss: function () {
                    cloak.classList.add('app-cloak-fading');
                    // On a timer rather than transitionend, which never fires when prefers-reduced-motion
                    // collapses the duration to zero. Reading the duration back off the element keeps this
                    // from drifting out of step with the stylesheet. The unit is parsed rather than
                    // assumed: Chromium serializes a computed <time> in seconds whatever the stylesheet
                    // wrote, but an engine that answered "300ms" would hold the cloak for 300 seconds.
                    var duration = getComputedStyle(cloak).transitionDuration.trim();
                    var ms = Number.parseFloat(duration) * (duration.endsWith('ms') ? 1 : 1000);
                    setTimeout(function () { cloak.remove(); }, ms);
                }
            };
        })();
    </script>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <!-- Called by Help.razor after an article renders. The WebView keeps the previous page's scroll
         offset when a help link routes back into the same component, and a cross-page anchor
         (calculations.md#surplus) has to reach its heading rather than the top of the page. -->
    <script>
        window.helpScroll = {
            // Headings take their ids from Markdig's UseAutoIdentifiers, so a link to one that has since
            // been renamed resolves to nothing - that falls back to the top rather than leaving the
            // reader at the offset the previous page was scrolled to. Where a found heading stops is
            // scroll-margin-top on .help-article's headings in app.css, which clears the fixed app bar.
            toTarget: function (id) {
                var target = id ? document.getElementById(id) : null;

                if (target) {
                    target.scrollIntoView();
                } else {
                    window.scrollTo(0, 0);
                }
            }
        };
    </script>

    <!-- Read by MainLayout.OpenDestinationAsync. Blazor's NavigationManager stamps every history entry it creates with
         _index, the entry's position in the session history; the entry the app starts on carries no state, so it is 0.
         Read from here rather than counted in .NET, where LocationChanged cannot tell a step back from a new entry, and
         rather than history.length, which also counts the entries ahead of the current one. -->
    <script>
        window.appHistory = {
            index: function () {
                return (history.state && history.state._index) || 0;
            }
        };
    </script>

    <!-- The on-screen keyboard policy, for every field in the app at once: Enter commits and closes the
         keyboard, a field the keyboard would cover scrolls into view, a picker keeps the keyboard up while its
         buttons are tapped and drops it when its list is scrolled, and while the keyboard is up <html> carries
         .keyboard-open (app.css hides the bottom bars off it). -->
    <script>
        (function () {
            var root = document.documentElement;

            function isSearchFocused() {
                var active = document.activeElement;
                return active !== null && active.tagName === 'INPUT' && active.closest('.record-search') !== null;
            }

            // MudTextField and MudNumericField commit on change, which the blur raises, so the bound value lands
            // before the keyboard closes. A textarea is not an INPUT and keeps Enter as a newline. MudSelect's
            // input is excluded because Enter opens and picks from its list on a hardware keyboard.
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' && e.target.tagName === 'INPUT' && !e.target.closest('.mud-select')) {
                    e.target.blur();
                }
            });

            // Labels the keyboard's Enter key to match. Set on focus rather than on every field's markup; the
            // IME reads the attribute when the field connects, which is after focusin. A field that already
            // names its own hint (RecordSearchBar's "search") keeps it.
            document.addEventListener('focusin', function (e) {
                if (e.target.tagName === 'INPUT' && !e.target.hasAttribute('enterkeyhint')) {
                    e.target.setAttribute('enterkeyhint', 'done');
                }
            });

            // A tap moves focus on mousedown, so cancelling it keeps the search field focused and the keyboard
            // up: search, tap +, search again. Only while the search field has focus, because a quantity field
            // being typed into has to blur and commit before its own + applies.
            document.addEventListener('mousedown', function (e) {
                if (e.target.closest('.record-row-stepper button') && isSearchFocused()) {
                    e.preventDefault();
                }
            }, true);

            // Scrolling a picker's list means the user is done typing, so the keyboard gets out of the way.
            // This is a user gesture, not a resize: blurring on resize is what sends an Android WebView into a
            // focus/keyboard loop.
            document.addEventListener('touchmove', function (e) {
                if (isSearchFocused() && e.target.closest('.picker-dialog-content') && !e.target.closest('.record-search')) {
                    document.activeElement.blur();
                }
            }, { passive: true });

            // SafeAreaInsetsInjector keeps the IME inset away from the Android WebView, which also stops the WebView
            // scrolling a focused field clear of the keyboard, so this does it once the shrunk layout has landed.
            // 'nearest' leaves a field that is already in view where it is. WKWebView never shrinks innerHeight for
            // the keyboard, so on iOS this never runs and the WebView's own scroll stands.
            var lastHeight = window.innerHeight;

            window.addEventListener('resize', function () {
                var active = document.activeElement;

                if (window.innerHeight < lastHeight && active !== null && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) {
                    active.scrollIntoView({ block: 'nearest' });
                }

                lastHeight = window.innerHeight;
            });

            // WKWebView leaves the layout viewport full height under the keyboard and shrinks only the visual
            // viewport, so the gap that leaves at the bottom is the keyboard. Android's SafeAreaInsetsInjector
            // resizes the WebView itself and marks the root with data-native-ime, where this would measure 0
            // and has to leave .keyboard-open alone. A pinch zoom shrinks the visual viewport too, hence scale.
            var viewport = window.visualViewport;

            if (viewport) {
                var onViewportChange = function () {
                    if ('nativeIme' in root.dataset) {
                        return;
                    }

                    var inset = Math.max(0, Math.round(window.innerHeight - viewport.height - viewport.offsetTop));
                    var open = inset > 0 && Math.abs(viewport.scale - 1) < 0.01;

                    root.style.setProperty('--keyboard-inset', (open ? inset : 0) + 'px');
                    root.classList.toggle('keyboard-open', open);
                };

                viewport.addEventListener('resize', onViewportChange);
                viewport.addEventListener('scroll', onViewportChange);
            }
        })();
    </script>

    <!-- Publishes the measured border-box height of every element that carries a data-height-var attribute
         as a custom property on the root element, named by that attribute's value, so the stylesheet can
         offset by a bar whose height depends on its content: the app bar grows when its title wraps
         (MainLayout tags it, and the app-bar-bottom variable in app.css reads the result). The property is
         removed when the element leaves the DOM, which lets the stylesheet's fallback value stand in until
         the next one renders. -->
    <script>
        (function () {
            var root = document.documentElement;
            var tracked = new Map();

            var resizeObserver = new ResizeObserver(function (entries) {
                entries.forEach(function (entry) {
                    var name = tracked.get(entry.target);

                    if (name) {
                        root.style.setProperty(name, entry.target.getBoundingClientRect().height + 'px');
                    }
                });
            });

            // Blazor renders and removes elements as pages change, so the set is re-read on every DOM
            // mutation rather than once; the attribute selector keeps that cheap.
            function sync() {
                var current = new Set(document.querySelectorAll('[data-height-var]'));

                tracked.forEach(function (name, element) {
                    if (!current.has(element)) {
                        resizeObserver.unobserve(element);
                        tracked.delete(element);
                        root.style.removeProperty(name);
                    }
                });

                current.forEach(function (element) {
                    if (!tracked.has(element)) {
                        tracked.set(element, element.dataset.heightVar);
                        resizeObserver.observe(element);
                    }
                });
            }

            new MutationObserver(sync).observe(document.body, { childList: true, subtree: true });
            sync();
        })();
    </script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
