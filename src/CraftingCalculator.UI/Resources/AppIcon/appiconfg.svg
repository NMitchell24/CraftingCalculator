<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Crafting Calculator app icon - the foreground (artwork) layer.

  Same artwork as Resources/Splash/splash.svg, redrawn flat. Three things about this file are
  load-bearing; changing them breaks a platform rather than just altering the look:

  1. The display window and the five buttons are HOLES punched in the calculator body by the
     single fill-rule="evenodd" path, not dark fills. Android 13+ themed icons reuse this
     foreground as the <monochrome> layer, keeping only its ALPHA and repainting it in the
     wallpaper tint - so anything expressed purely in colour flattens away. As holes they let
     the background layer through, which reads as the dark screen and keypad in the full-colour
     icon and keeps them visible when tinted.
  2. The orbits are clipped out of the calculator's footprint. Nothing changes in the colour
     icon (the opaque body already covered them), but without it the holes above would expose
     orbit lines instead of the background.
  3. The artwork is scaled to 0.62 about the centre. An adaptive icon guarantees only the middle
     72 of its 108dp canvas; launchers using a circular mask clip anything beyond it.

  The master's Inkscape filters are deliberately dropped here: they are invisible at 48dp and
  are discarded by the monochrome tint anyway. The splash keeps them.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" version="1.1">
  <defs>
    <clipPath id="outside-calculator" clipPathUnits="userSpaceOnUse">
      <path clip-rule="evenodd" d="M -256,-256 H 768 V 768 H -256 Z M 214,164 H 294 A 20,20 0 0 1 314,184 V 324 A 20,20 0 0 1 294,344 H 214 A 20,20 0 0 1 194,324 V 184 A 20,20 0 0 1 214,164 Z" />
    </clipPath>
  </defs>
  <g transform="translate(256,256) scale(0.62) translate(-256,-256)">
    <g clip-path="url(#outside-calculator)" fill="none" stroke="#FFFFFF" stroke-width="14.7">
      <ellipse cx="256" cy="256" rx="238.08455" ry="42.605103" />
      <ellipse cx="-251.90691" cy="260.02869" rx="238.08455" ry="42.605103" transform="rotate(-89.091086)" />
      <ellipse cx="-361.99771" cy="5.4446874" rx="238.08455" ry="42.605103" transform="rotate(-134.1383)" />
      <ellipse cx="-5.4450402" cy="361.99771" rx="238.08455" ry="42.605103" transform="rotate(-45.861758)" />
    </g>
