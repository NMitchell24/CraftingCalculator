name: Build

# Manual only, on purpose. These jobs install platform workloads and SDKs and take minutes each,
# which is not what every PR should pay for - `unit-tests.yml` is the PR gate. Once the app is
# finished these become the automated build/release pipeline and trigger on a version tag.
on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# Every head builds -c Release on purpose: trimming, linker and interpreter failures do not exist in
# Debug, so a Debug-only build stays green while the shipped app crashes on launch.
jobs:

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload restore src/CraftingCalculator.UI/CraftingCalculator.UI.csproj

      - name: Build
        run: >
          dotnet build src/CraftingCalculator.UI/CraftingCalculator.UI.csproj
          -f net10.0-windows10.0.19041.0 -c Release

      # The unpackaged win-x64 drop. `dotnet build` does not produce the MSIX - that needs an explicit
      # packaging target and a signing certificate, neither of which this job has.
      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: windows-win-x64
          path: src/CraftingCalculator.UI/bin/Release/net10.0-windows10.0.19041.0/win-x64/

  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 17, not whatever the image defaults to: 21 fails ValidateJavaVersion (XA0034) with a
      # null-path crash. See docs/dev-environment.md.
      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Named explicitly rather than `dotnet workload restore`, which would resolve the project's
      # net10.0-ios TFM as well and has nothing to install it from on Linux.
      - name: Install Android workloads
        run: dotnet workload install android maui-android

      - name: Publish
        run: >
          dotnet publish src/CraftingCalculator.UI/CraftingCalculator.UI.csproj
          -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      # Signed with the debug keystore the Android SDK generates - installable for testing, not a
      # release-signed artifact.
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: src/CraftingCalculator.UI/bin/Release/net10.0-android/publish/*.apk

  ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The net10.0-ios TFM needs the Apple SDK 26 workload band, which requires a matching Xcode.
      # Pinning a version the runner image does not carry fails the job outright, so track the image.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # On macOS the project resolves to net10.0-ios alone, so restoring from it installs maui-ios
      # and nothing else.
      - name: Install MAUI workloads
        run: dotnet workload restore src/CraftingCalculator.UI/CraftingCalculator.UI.csproj

      # CodesignKey="" on the command line is a global property, so it beats the csproj's
      # Release-configuration "iPhone Distribution" and the build needs no Apple account or
      # certificate. Compile check only - no archive, no signing, no artifact.
      - name: Build
        run: >
          dotnet build src/CraftingCalculator.UI/CraftingCalculator.UI.csproj
          -f net10.0-ios -c Release -p:CodesignKey=""
