name: Build

on:
  push:
    branches: [master]
  # No branch filter: this runs on a PR into any base, so the stacked migration PRs and everything
  # after them are covered without naming a branch that gets deleted when it merges.
  pull_request:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

# The workflow this replaced had push + pull_request + a nightly cron with no guard, so pushing to an
# open PR's branch ran the whole matrix twice.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Domain / Application / Infrastructure + both test suites, via CraftingCalculator.Tests.slnf. No
  # MAUI workloads and no platform SDKs, so it is the fast job that gates every PR. Add any new
  # non-MAUI project to the .slnf or it silently stops being built here.
  core:
    name: Core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CraftingCalculator.Tests.slnf

      - name: Verify formatting
        run: dotnet format CraftingCalculator.Tests.slnf --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CraftingCalculator.Tests.slnf -c Release --no-restore

      # No LogFileName: both test projects write into the same results directory, and the default trx
      # name is unique per assembly and run where a fixed one would have the second overwrite the first.
      - name: Test
        run: >
          dotnet test CraftingCalculator.Tests.slnf -c Release --no-build
          --logger trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results

  # Every head below builds -c Release on purpose: trimming, linker and interpreter failures do not
  # exist in Debug, so a Debug-only CI stays green while the shipped app crashes on launch.

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workloads
        run: dotnet workload restore src/CraftingCalculator.UI/CraftingCalculator.UI.csproj

      - name: Build
        run: >
          dotnet build src/CraftingCalculator.UI/CraftingCalculator.UI.csproj
          -f net10.0-windows10.0.19041.0 -c Release

      # The unpackaged win-x64 drop. `dotnet build` does not produce the MSIX - that needs an explicit
      # packaging target and a signing certificate, neither of which this job has.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: windows-win-x64
          path: src/CraftingCalculator.UI/bin/Release/net10.0-windows10.0.19041.0/win-x64/

  android:
    name: Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # JDK 17, not whatever the image defaults to: 21 fails ValidateJavaVersion (XA0034) with a
      # null-path crash. See docs/dev-environment.md.
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Named explicitly rather than `dotnet workload restore`, which would resolve the project's
      # net10.0-ios TFM as well and has nothing to install it from on Linux.
      - name: Install Android workloads
        run: dotnet workload install android maui-android

      - name: Publish
        run: >
          dotnet publish src/CraftingCalculator.UI/CraftingCalculator.UI.csproj
          -f net10.0-android -c Release -p:AndroidPackageFormat=apk

      # Signed with the debug keystore the Android SDK generates - installable for testing, not a
      # release-signed artifact.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src/CraftingCalculator.UI/bin/Release/net10.0-android/publish/*.apk

  ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The net10.0-ios TFM needs the Apple SDK 26 workload band, which requires a matching Xcode.
      # Pinning a version the runner image does not carry fails the job outright, so track the image.
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # On macOS the project resolves to net10.0-ios alone, so restoring from it installs maui-ios
      # and nothing else.
      - name: Install MAUI workloads
        run: dotnet workload restore src/CraftingCalculator.UI/CraftingCalculator.UI.csproj

      # CodesignKey="" on the command line is a global property, so it beats the csproj's
      # Release-configuration "iPhone Distribution" and the build needs no Apple account or
      # certificate. Compile check only - no archive, no signing, no artifact.
      - name: Build
        run: >
          dotnet build src/CraftingCalculator.UI/CraftingCalculator.UI.csproj
          -f net10.0-ios -c Release -p:CodesignKey=""
