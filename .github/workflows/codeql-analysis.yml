name: CodeQL

on:
  # push + schedule are what populate the default branch's security alerts and re-scan unchanged code
  # against newly published queries, so unlike unit-tests.yml this workflow keeps both.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual

      # Manual build instead of autobuild: autobuild targets the whole solution, and the
      # CraftingCalculator.UI MAUI head's per-platform TFMs need the MAUI workloads and platform SDKs.
      # CraftingCalculator.Tests.slnf is Domain / Application / Infrastructure + both test projects,
      # which is where the analyzable logic lives.
      - name: Build
        run: dotnet build CraftingCalculator.Tests.slnf -c Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
